name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências de teste
        run: pip install -r requirements-dev.txt
      - name: Compilar módulos
        run: python -m compileall -q src pipeline analysis tests *.py
      - name: Testes offline (API simulada)
        run: python -m pytest -q
      - name: Validar histórico e páginas versionadas
        run: python -m pipeline.integrity --published .
      - name: Regenerar painéis offline numa cópia
        run: python -m pipeline.offline_check
