name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Compilar módulos
        run: python -m py_compile main.py predictor.py adjusted_xg.py database.py backtest.py recalibracao.py team_stats.py api.py settlement.py

      - name: Smoke test da calibração
        run: python tests/test_calibracao.py
