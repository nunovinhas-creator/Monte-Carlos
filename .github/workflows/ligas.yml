name: Auditar Ligas BSD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: repo-writes
      cancel-in-progress: false

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests

      - name: Executar ligas_bsd.py
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python ligas_bsd.py

      - name: Commit do ligas_bsd.json se houver alterações
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ligas_bsd.json
          git diff --staged --quiet && echo "Sem alterações" && exit 0
          git commit -m "Auto-update: ligas_bsd.json"
          git pull --rebase --autostash
          git push

      - name: Publicar ligas_bsd.json como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ligas-bsd
          path: ligas_bsd.json
