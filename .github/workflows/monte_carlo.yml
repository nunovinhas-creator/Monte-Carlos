name: Executar Previsões e Backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monte_carlo.yml'
      - 'src/**'
      - 'pipeline/**'
      - 'analysis/**'
      - '*.py'
      - 'requirements*.txt'
      - 'calibracao_o25_v2.json'
      - 'recalibracao.json'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Ativar SETTLEMENT_DEBUG=1 só nesta corrida'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: repo-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Testes offline antes de consumir API
        run: python -m pytest -q
      - name: Baseline e cópia de recuperação antes da migração
        run: |
          mkdir -p work
          python -m pipeline.integrity --write-state work/before.json
          python - <<'PY'
          import sqlite3
          with sqlite3.connect('predictions.db') as source, sqlite3.connect('work/pre-run.db') as target:
              source.backup(target)
          PY
      - name: Verificar configuração da API BSD
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: |
          if [ -z "$BSD_API_TOKEN" ]; then
            echo '::error::Secret BSD_API_TOKEN em falta.'
            exit 1
          fi
      - name: Recolher jogos e atualizar previsões
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          TEAM_STATS_MAX_CALLS: '200'
        run: python -m src.main
      - name: Capturar odds BSD (consenso não executável)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          ODDS_MAX_CALLS: '80'
        run: python -m pipeline.odds_tracking
      - name: Liquidar resultados
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          SETTLEMENT_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug && '1') || vars.SETTLEMENT_DEBUG || '0' }}
          SETTLEMENT_DELAY: ${{ vars.SETTLEMENT_DELAY || '0.5' }}
        run: python -m pipeline.settlement
      - name: Verificar preservação histórica e cobertura mínima operacional
        run: python -m pipeline.integrity --compare work/before.json --min-coverage 0.25
      - name: Gerar backtest
        run: python -m analysis.backtest
      - name: Gerar laboratório ROI e CSV
        run: python -m analysis.roi_report
      - name: Validar artefactos antes de persistir/publicar
        run: python -m pipeline.integrity --compare work/before.json --published . --min-coverage 0.25
      - name: Diagnóstico independente de cobertura
        if: always()
        run: python -m pipeline.health_summary
      - name: Persistir dados e painéis na main
        id: persist
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo '::error::A main mudou durante a corrida; não sobrescrever dados nem fazer rebase automático da SQLite.'
            exit 1
          fi
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add index.html backtest.html roi.html roi_jogos.csv predictions.db
          if ! git diff --staged --quiet; then
            git commit -m 'Auto-update: previsões imutáveis, resultados e painéis'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Confirmar SHA no Pages (build de recurso apenas se ausente)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.persist.outputs.sha }}
        run: |
          python -m pipeline.pages_status
      - name: Recuperação de corrida falhada (1 dia; não publicar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlos-recovery-${{ github.run_id }}
          path: |
            work/pre-run.db
            predictions.db
          retention-days: 1
          compression-level: 9
