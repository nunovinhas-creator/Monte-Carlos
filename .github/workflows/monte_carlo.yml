name: Executar Previsões e Backtest

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Ativar SETTLEMENT_DEBUG=1 so nesta corrida'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests

      - name: Executar Previsões Monte Carlo (main.py)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          TEAM_STATS_MAX_CALLS: "200"
        run: python main.py

      - name: Liquidar Resultados Pendentes (settlement.py)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          SETTLEMENT_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug && '1') || vars.SETTLEMENT_DEBUG || '0' }}
        run: python settlement.py

      - name: Gerar Relatório de Backtest (backtest.py)
        run: python backtest.py

      - name: Commit e Push das Alterações
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html backtest.html predictions.db
          git diff --staged --quiet && echo "Sem alterações" && exit 0
          git commit -m "Auto-update: dashboard, backtest e base de dados"
          git pull --rebase --autostash
          git push
