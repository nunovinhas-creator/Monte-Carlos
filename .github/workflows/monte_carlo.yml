name: Executar Previsões e Backtest

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests

      - name: Executar Previsões Monte Carlo (main.py)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python main.py

      - name: Liquidar Resultados Pendentes (settlement.py)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python settlement.py

      - name: Gerar Relatório de Backtest (backtest.py)
        run: python backtest.py

      - name: Commit e Push das Alterações
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html backtest.html predictions.db
          git commit -m "Auto-update: dashboard, backtest e base de dados" || exit 0
          git push
